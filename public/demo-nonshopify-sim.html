<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Prospect PDP (sim) — NOT Shopify</title>
<!--
  LOCAL-ONLY harness for the demo engine's non-Shopify path. Excluded from the
  Docker build (see .dockerignore).

  Difference vs demo-prospect-sim.html: that one is a PROSPECT SHOPIFY store —
  /products/<handle> URL, window.Shopify, a /cart/add form, a working
  /products/<handle>.js. This one is a store on ANY OTHER stack: the URL has no
  /products/ segment, there is no window.Shopify, no /cart/add form, and no
  product JSON route. og:image and JSON-LD ARE present (most non-Shopify stores
  ship them) precisely to prove the point: widget-main.js's detection is guarded
  on a /products/ URL, so it can't use either — which is why the widget used to
  fall back to the DEMO STORE's featured product (the blue romper) and why the
  PDP image swap never fired.

  What to check here:
    1. Boot → toast "Not a Shopify store — hit Try it on and click the product photo"
    2. Press "Try it on" → the picker arms instead of spending a render
    3. Click the hero → __elloDemo.host() shows the page's own photo + title
    4. __elloWidget.debugPdpSwap() → isPdp true, garmentIsThisProduct true,
       resolvedHero = the picked photo (NOT a thumbnail)

  The gallery deliberately makes auto-detection hard: the hero is srcset +
  lazy-loaded (src is a placeholder), the markup uses no recognizable Shopify
  gallery class, and a thumbnail rail sits right next to it.

  Run:  npm run vite   →   http://localhost:3000/demo-nonshopify-sim.html
-->
<meta property="og:title" content="Oversized Linen Blazer — Oatmeal">
<meta property="og:image" content="https://cdn.shopify.com/s/files/1/1775/6429/files/w6120_monogram_001_03_31_floor_0b2052b5-70af-4a7e-83f7-5948ec001a7e.jpg?v=1774896248">
<meta property="og:type" content="product">
<meta property="product:price:amount" content="248.00">
<style>
  *{box-sizing:border-box;}
  body{margin:0;font-family:"Helvetica Neue",-apple-system,BlinkMacSystemFont,Arial,sans-serif;color:#1b1b1b;}
  header{display:flex;align-items:center;justify-content:space-between;padding:18px 34px;border-bottom:1px solid #ece8e1;}
  .brand{font-weight:700;letter-spacing:.22em;font-size:14px;}
  main{max-width:1140px;margin:0 auto;padding:38px 26px;display:grid;grid-template-columns:1.15fr 1fr;gap:52px;}
  /* No Shopify-ish class names anywhere in the gallery — auto-detection has
     nothing to key off but raw size, and the thumb rail is a live decoy. */
  .stage{display:flex;gap:14px;}
  .rail{display:flex;flex-direction:column;gap:10px;flex:0 0 84px;}
  .rail img{width:84px;height:112px;object-fit:cover;border:1px solid #e6e1d8;cursor:pointer;background:#f6f3ee;}
  .rail img.on{border-color:#1b1b1b;}
  .frame{flex:1;background:#f6f3ee;}
  .frame img{width:100%;display:block;}
  h1{font-size:26px;font-weight:600;margin:0 0 8px;letter-spacing:-.01em;}
  .price{font-size:18px;margin:0 0 26px;color:#4a4a4a;}
  .lbl{display:block;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:#8a8279;margin:20px 0 8px;}
  .swatches{display:flex;gap:10px;}
  .sw{width:38px;height:38px;border-radius:50%;border:1px solid #ddd6cb;cursor:pointer;padding:0;}
  .sw[aria-checked="true"]{box-shadow:0 0 0 2px #1b1b1b;}
  .sizes{display:flex;gap:8px;flex-wrap:wrap;}
  .sz{min-width:52px;padding:11px 0;border:1px solid #ddd6cb;background:#fff;cursor:pointer;font:inherit;font-size:13px;}
  .bag{width:100%;height:56px;margin-top:26px;border:none;background:#1b1b1b;color:#fff;font-size:14px;letter-spacing:.1em;text-transform:uppercase;cursor:pointer;}
  .desc{margin-top:22px;font-size:14px;line-height:1.65;color:#5a5449;}
  @media(max-width:820px){main{grid-template-columns:1fr;}}
</style>
</head>
<body>
<header>
  <div class="brand">ATELIER NORTH</div>
  <div style="color:#9a938a;font-size:12px;">simulated NON-Shopify storefront (custom stack, no Ello install)</div>
</header>

<main>
  <div class="stage">
    <div class="rail">
      <img class="on" data-full="https://cdn.shopify.com/s/files/1/1775/6429/files/w6120_monogram_001_03_31_floor_0b2052b5-70af-4a7e-83f7-5948ec001a7e.jpg?v=1774896248"
           src="https://cdn.shopify.com/s/files/1/1775/6429/files/w6120_monogram_001_03_31_floor_0b2052b5-70af-4a7e-83f7-5948ec001a7e.jpg?v=1774896248&width=180" alt="View 1">
      <img data-full="https://cdn.shopify.com/s/files/1/0562/9865/1332/files/DSC_0287_1.jpg"
           src="https://cdn.shopify.com/s/files/1/0562/9865/1332/files/DSC_0287_1.jpg?width=180" alt="View 2">
      <img data-full="https://cdn.shopify.com/s/files/1/0562/9865/1332/files/DSC_0335.jpg"
           src="https://cdn.shopify.com/s/files/1/0562/9865/1332/files/DSC_0335.jpg?width=180" alt="View 3">
    </div>
    <!-- Hero: lazy-loaded (src IS a placeholder until the observer fires) and
         served through srcset, so the rep's click has to resolve a real URL out
         of srcset/data-src rather than trusting img.src. -->
    <div class="frame">
      <img id="hero"
           src="data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7"
           data-src="https://cdn.shopify.com/s/files/1/1775/6429/files/w6120_monogram_001_03_31_floor_0b2052b5-70af-4a7e-83f7-5948ec001a7e.jpg?v=1774896248"
           srcset="https://cdn.shopify.com/s/files/1/1775/6429/files/w6120_monogram_001_03_31_floor_0b2052b5-70af-4a7e-83f7-5948ec001a7e.jpg?v=1774896248&width=600 600w,
                   https://cdn.shopify.com/s/files/1/1775/6429/files/w6120_monogram_001_03_31_floor_0b2052b5-70af-4a7e-83f7-5948ec001a7e.jpg?v=1774896248&width=1400 1400w"
           sizes="(max-width:820px) 100vw, 640px"
           alt="Oversized Linen Blazer — Oatmeal">
    </div>
  </div>

  <div>
    <h1>Oversized Linen Blazer</h1>
    <p class="price">$248.00</p>

    <span class="lbl">Colour — <em id="colorName">Oatmeal</em></span>
    <div class="swatches" role="radiogroup">
      <button class="sw" style="background:#e7ddcd" role="radio" aria-checked="true" data-color="Oatmeal"></button>
      <button class="sw" style="background:#2f3a44" role="radio" aria-checked="false" data-color="Slate"></button>
    </div>

    <span class="lbl">Size</span>
    <div class="sizes">
      <button class="sz">XS</button><button class="sz">S</button>
      <button class="sz">M</button><button class="sz">L</button>
    </div>

    <!-- No <form action="/cart/add"> and no name="add": the engine has to find
         this by its LABEL text, the same sweep real non-Shopify stores need. -->
    <button class="bag" type="button">Add to bag</button>

    <p class="desc">Relaxed, unstructured tailoring in a heavyweight European linen.
      Dropped shoulder, patch pockets, horn buttons. Cut to be worn open.</p>
  </div>
</main>

<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "Product",
  "name": "Oversized Linen Blazer — Oatmeal",
  "image": "https://cdn.shopify.com/s/files/1/1775/6429/files/w6120_monogram_001_03_31_floor_0b2052b5-70af-4a7e-83f7-5948ec001a7e.jpg?v=1774896248",
  "url": "https://ateliernorth.example/shop/outerwear/oversized-linen-blazer",
  "offers": { "@type": "Offer", "price": "248.00", "priceCurrency": "USD", "availability": "https://schema.org/InStock" }
}
</script>

<script>
  // A URL shape Shopify never produces — this is the whole point of the harness.
  try { history.replaceState({}, '', '/shop/outerwear/oversized-linen-blazer'); } catch (e) {}

  // Lazy-load the hero the way a real gallery does, a beat after paint.
  setTimeout(function () {
    var hero = document.getElementById('hero');
    if (hero && hero.dataset.src) hero.src = hero.dataset.src;
  }, 600);

  // Thumbnails + colour swatches re-point the hero — proves the picked SELECTOR
  // keeps working (and that the garment follows the image now on screen).
  document.querySelectorAll('.rail img').forEach(function (t) {
    t.addEventListener('click', function () {
      document.querySelectorAll('.rail img').forEach(function (x) { x.classList.remove('on'); });
      t.classList.add('on');
      var hero = document.getElementById('hero');
      hero.removeAttribute('srcset');
      hero.src = t.dataset.full;
    });
  });
  document.querySelectorAll('.sw').forEach(function (b) {
    b.addEventListener('click', function () {
      document.querySelectorAll('.sw').forEach(function (x) { x.setAttribute('aria-checked', 'false'); });
      b.setAttribute('aria-checked', 'true');
      document.getElementById('colorName').textContent = b.dataset.color;
    });
  });

  // NOTE: deliberately NO window.Shopify, NO /cart/add form, NO fetch mocks —
  // /products/<handle>.js 404s here exactly like it does on a real non-Shopify
  // store, so the engine's fallbacks are what's under test.

  // ── Load the demo engine exactly as the bookmarklet does (same-origin here) ──
  var s = document.createElement('script');
  s.src = '/demo-bookmarklet.js?t=' + Date.now();
  document.head.appendChild(s);
</script>
</body>
</html>
